name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  unit:
    name: Unit tests (no Kafka)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Run unit tests
        run: python tests/run_suite.py --suite unit

  kafka:
    name: Kafka smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Start Kafka and wait for readiness
        shell: bash
        run: |
          docker compose -f docker/docker-compose.yml up -d kafka
          for attempt in {1..30}; do
            if docker compose -f docker/docker-compose.yml exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run broker integration tests
        run: python tests/run_suite.py --suite kafka
      - name: Broker logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color kafka
      - name: Stop test broker
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
