# Optional overlay. Standard showcase does not load this file or activate email.
x-email: &email
  EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
  EMAIL_ALERT_MODE: ${EMAIL_ALERT_MODE:-individual}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  EMAIL_SMTP_SECURITY: ${EMAIL_SMTP_SECURITY:-none}
  EMAIL_FROM: ${EMAIL_FROM:-energy@example.test}
  EMAIL_TO: ${EMAIL_TO:-viewer@example.test}
  EMAIL_RUN_ID: ${EMAIL_RUN_ID:-}
  EMAIL_BUILDING_ID: ${EMAIL_BUILDING_ID:-}
  EMAIL_SOURCE_ID: ${EMAIL_SOURCE_ID:-}
  EMAIL_COOLDOWN_MINUTES: ${EMAIL_COOLDOWN_MINUTES:-30}
  EMAIL_REAL_DELIVERY_ENABLED: ${EMAIL_REAL_DELIVERY_ENABLED:-false}
services:
  worker:
    image: energy-email-backend:local
    environment: *email
  notifier:
    image: energy-email-backend:local
    extends:
      file: docker-compose.dashboard.yml
      service: tools
    profiles: [notifications]
    user: '10001:10001'
    volumes:
      - ../artifacts:/app/artifacts:ro
      - ../data:/app/data:ro
    environment: *email
    command: [python, -m, notifications.notifier]
  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    profiles: [notifications]
    networks: [backend, edge]
    volumes: [mailpitdata:/data]
    ports: ['127.0.0.1:${EMAIL_MAILPIT_WEB_PORT:-8025}:8025']
    environment:
      MP_MAX_MESSAGES: 1000
      MP_DATABASE: /data/mailpit.db
    # SMTP is internal only, no relay/forwarding configuration.

volumes:
  mailpitdata:
