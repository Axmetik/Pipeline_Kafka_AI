server {
    listen 8080;
    server_name localhost;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 1d; }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 10s;
        add_header Cache-Control no-store always;
    }
    location /health/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host localhost; }
}
